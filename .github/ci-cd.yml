name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1) PRUEBAS: levanta la app, corre pytest + Playwright y reporta
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      OO_URL: http://${{ secrets.EC2_HOST }}:5080/api/default
      OO_USER: ${{ secrets.OO_USER }}
      OO_PASS: ${{ secrets.OO_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Levantar la app con Docker
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -sf http://localhost/api/health && break
            sleep 2
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de pruebas
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar pruebas (pytest + Playwright)
        id: tests
        continue-on-error: true
        run: pytest --base-url http://localhost

      - name: Enviar resultados a OpenObserve
        if: always()
        run: |
          COMMON=$(jq -nc --arg commit "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" \
            --arg actor "$GITHUB_ACTOR" --arg run_id "$GITHUB_RUN_ID" \
            '{commit:$commit, branch:$branch, actor:$actor, run_id:$run_id}')
          PASSED=0; FAILED=0
          if [ -f reports/results.jsonl ]; then
            jq -s --argjson c "$COMMON" 'map(. + $c)' reports/results.jsonl > tests_payload.json
            curl -s --max-time 20 -u "$OO_USER:$OO_PASS" -H "Content-Type: application/json" \
              -d @tests_payload.json "$OO_URL/cicd_tests/_json" || true
            PASSED=$(jq -s '[.[] | select(.outcome=="passed")] | length' reports/results.jsonl)
            FAILED=$(jq -s '[.[] | select(.outcome=="failed")] | length' reports/results.jsonl)
          fi
          jq -nc --argjson c "$COMMON" --arg result "${{ steps.tests.outcome }}" \
            --argjson passed "$PASSED" --argjson failed "$FAILED" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '[$c + {event:"tests", result:$result, passed:$passed, failed:$failed, run_url:$run_url}]' \
            > pipeline_payload.json
          curl -s --max-time 20 -u "$OO_USER:$OO_PASS" -H "Content-Type: application/json" \
            -d @pipeline_payload.json "$OO_URL/cicd_pipeline/_json" || true

      - name: Guardar reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reports/

      - name: Bloquear el despliegue si fallaron las pruebas
        if: steps.tests.outcome != 'success'
        run: |
          echo "Las pruebas fallaron: no se despliega."
          exit 1

  # ------------------------------------------------------------------
  # 2) DEPLOY: solo corre si 'test' termino bien (needs)
  # ------------------------------------------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      OO_URL: http://${{ secrets.EC2_HOST }}:5080/api/default
      OO_USER: ${{ secrets.OO_USER }}
      OO_PASS: ${{ secrets.OO_PASS }}
    steps:
      - name: Desplegar en EC2 por SSH
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          printf '%s\n' "$EC2_KEY" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i key.pem ubuntu@"$EC2_HOST" \
            "cd ~/app && git fetch origin main && git reset --hard origin/main && docker compose up -d --build && docker image prune -f"

      - name: Registrar despliegue en OpenObserve
        if: always()
        run: |
          jq -nc --arg status "${{ job.status }}" --arg commit "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" --arg actor "$GITHUB_ACTOR" \
            --arg run_id "$GITHUB_RUN_ID" --arg host "${{ secrets.EC2_HOST }}" \
            '[{event:"deploy", status:$status, commit:$commit, branch:$branch, actor:$actor, run_id:$run_id, host:$host}]' \
            > deploy_payload.json
          curl -s --max-time 20 -u "$OO_USER:$OO_PASS" -H "Content-Type: application/json" \
            -d @deploy_payload.json "$OO_URL/cicd_pipeline/_json" || true
