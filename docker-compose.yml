services:
  app:
    build: .
    container_name: app
    restart: always
    environment:
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-2026}
      DB_PATH: /data/data.db
    volumes:
      - ./data:/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app